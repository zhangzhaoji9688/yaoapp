<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邀评管理系统</title>
<style>
* { margin:0; padding:0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f0f2f5; height: 100vh; overflow: hidden; }

.container { display: flex; height: 100vh; }

/* ===== 左侧面板 ===== */
.left-panel {
  width: 370px; background: #fff; padding: 22px 18px;
  box-shadow: 2px 0 12px rgba(0,0,0,0.08); overflow-y: auto;
  flex-shrink: 0; display: flex; flex-direction: column; gap: 13px;
}
.left-panel h2 { font-size: 18px; color: #1a1a1a; border-bottom: 3px solid #1677ff; padding-bottom: 9px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 13px; color: #555; font-weight: 500; }
.form-group select,
.form-group input {
  padding: 9px 11px; border: 1.5px solid #d9d9d9; border-radius: 8px;
  font-size: 14px; outline: none; transition: border-color .2s; font-family: inherit;
}
.form-group select:focus, .form-group input:focus { border-color: #1677ff; }

.sku-selector { display: flex; flex-wrap: wrap; gap: 6px; }
.sku-btn {
  padding: 5px 13px; border: 1.5px solid #d9d9d9; border-radius: 18px;
  background: #fafafa; font-size: 13px; cursor: pointer; transition: all .2s;
  user-select: none; color: #333;
}
.sku-btn:hover { border-color: #1677ff; color: #1677ff; background: #e6f4ff; }
.sku-btn.active { background: #1677ff; color: #fff; border-color: #1677ff; font-weight: 600; }

/* 新增SKU按钮 */
.sku-add-btn {
  padding: 5px 11px; border: 1.5px dashed #1677ff; border-radius: 18px;
  background: #fff; font-size: 13px; cursor: pointer; transition: all .2s;
  user-select: none; color: #1677ff; display: inline-flex; align-items: center; gap: 3px;
}
.sku-add-btn:hover { background: #e6f4ff; }

/* 新增SKU输入区 */
.sku-add-row {
  display: none; align-items: center; gap: 6px; flex-wrap: nowrap; margin-top: 2px;
}
.sku-add-row.show { display: flex; }
.sku-add-row input {
  flex: 1; padding: 5px 10px; border: 1.5px solid #1677ff; border-radius: 8px;
  font-size: 13px; outline: none; font-family: inherit; min-width: 0;
}
.sku-add-row .btn-ok {
  padding: 5px 12px; background: #1677ff; color: #fff; border: none;
  border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.sku-add-row .btn-ok:hover { opacity: .85; }
.sku-add-row .btn-cancel-s {
  padding: 5px 10px; background: #f0f0f0; color: #555; border: none;
  border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.sku-add-row .btn-cancel-s:hover { background: #e0e0e0; }

.btn-add {
  width: 100%; padding: 11px; margin-top: 4px;
  background: linear-gradient(135deg, #1677ff, #4096ff); color: #fff;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.btn-add:hover { opacity: .88; }

/* ===== 右侧面板 ===== */
.right-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: #f0f2f5;
}

/* 顶部固定区 */
.right-top-fixed {
  flex-shrink: 0; background: #f0f2f5; z-index: 200;
  padding: 22px 24px 0 24px;
}
.right-scroll-body {
  flex: 1; overflow-y: auto; padding: 0 24px 24px 24px;
}

.right-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
.right-header h2 { font-size: 19px; color: #1a1a1a; }
.stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stat-badge {
  background: #fff; padding: 5px 13px; border-radius: 18px;
  font-size: 13px; color: #555; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.stat-badge b { color: #1677ff; font-size: 15px; }

/* 店铺标签 sticky */
.shop-tabs {
  display: flex; gap: 8px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 150;
  background: #f0f2f5; padding: 10px 0; margin-bottom: 2px;
}
.shop-tab {
  padding: 7px 20px; border: 1.5px solid #d9d9d9; border-radius: 8px;
  cursor: pointer; font-size: 14px; color: #555; background: #fff; transition: all .2s;
}
.shop-tab:hover { border-color: #1677ff; color: #1677ff; }
.shop-tab.active { background: #1677ff; color: #fff; border-color: #1677ff; font-weight: 600; }

/* 搜索 */
.search-wrap { margin-bottom: 14px; }
.search-wrap input {
  width: 300px; max-width: 100%; padding: 9px 16px; border: 1.5px solid #d9d9d9;
  border-radius: 22px; font-size: 14px; outline: none; transition: border-color .2s;
}
.search-wrap input:focus { border-color: #1677ff; }

/* ===== SKU 分组区块 ===== */
.sku-section {
  background: #fff; border-radius: 12px; margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden;
}

/* SKU 表头 sticky */
.sku-section-header {
  font-size: 14px; font-weight: 700; color: #1677ff;
  padding: 12px 18px;
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  border-bottom: 2px solid #f0f2f5;
  display: flex; justify-content: space-between; align-items: center;
}

/* 表格 - 统一列宽 */
.sku-section table {
  width: 100%; table-layout: fixed; border-collapse: collapse;
  font-size: 13px;
}
/* 统一列宽定义 - 所有表格共享 */
.sku-section table colgroup .col-cb    { width: 38px; }
.sku-section table colgroup .col-oid   { width: 22%; }
.sku-section table colgroup .col-date  { width: 14%; }
.sku-section table colgroup .col-reason { width: 44%; }
.sku-section table colgroup .col-action { width: 120px; }

.sku-section thead { background: #1677ff; color: #fff; }
.sku-section th {
  padding: 9px 10px; text-align: left; font-weight: 600; font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sku-section td {
  padding: 8px 10px; border-bottom: 1px solid #f0f0f0;
  vertical-align: middle; color: #333;
  overflow: hidden; text-overflow: ellipsis;
}
.sku-section tbody tr:nth-child(even) { background: #fafafa; }
.sku-section tbody tr:hover { background: #e6f4ff; }

.checkbox-cell { text-align: center; }
.action-cell { white-space: nowrap; }

/* 按钮 */
.btn-sm {
  padding: 4px 10px; border: none; border-radius: 5px; font-size: 12px;
  cursor: pointer; transition: opacity .2s; margin-right: 3px; color: #fff;
}
.btn-edit { background: #faad14; }
.btn-del { background: #ff4d4f; }
.btn-save { background: #52c41a; }
.btn-cancel { background: #8c8c8c; }

.btn-batch-del {
  padding: 7px 16px; background: #ff4d4f; color: #fff; border: none;
  border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
  display: none; transition: opacity .2s;
}
.btn-batch-del.show { display: inline-block; }
.btn-batch-del:hover { opacity: .85; }

/* 编辑状态 */
.edit-input {
  width: 100%; padding: 4px 7px; border: 1.5px solid #1677ff; border-radius: 4px;
  font-size: 13px; font-family: inherit; outline: none;
  box-sizing: border-box;
}
.edit-input:focus { box-shadow: 0 0 4px rgba(22,119,255,0.3); }

.no-data { text-align: center; padding: 50px 20px; color: #bbb; font-size: 15px; }

/* 弹框 */
.modal-mask {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  z-index: 9999; justify-content: center; align-items: center;
}
.modal-mask.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 14px; padding: 26px 30px; max-width: 400px; width: 90%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2); text-align: center;
}
.modal-box h3 { font-size: 17px; color: #1a1a1a; margin-bottom: 10px; }
.modal-box p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.6; }
.modal-actions { display: flex; gap: 12px; justify-content: center; }
.modal-actions button {
  padding: 8px 26px; border: none; border-radius: 8px; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.modal-actions .btn-confirm { background: #ff4d4f; color: #fff; }
.modal-actions .btn-cancel-m { background: #f0f0f0; color: #333; }
.modal-actions button:hover { opacity: .82; }

/* ===== 登录浮层 ===== */
.login-mask { z-index: 100000; background: linear-gradient(135deg,#e6f4ff,#f0f2f5); }
.login-box {
  background: #fff; border-radius: 16px; padding: 34px 38px; width: 340px; max-width: 92%;
  box-shadow: 0 14px 50px rgba(0,0,0,0.18); text-align: left;
}
.login-box h2 { font-size: 20px; color:#1a1a1a; margin-bottom: 22px; text-align:center; }
.login-box .form-group { margin-bottom: 14px; }
.login-box .form-group input {
  width: 100%; padding: 10px 12px; border: 1.5px solid #d9d9d9; border-radius: 8px;
  font-size: 14px; outline: none; font-family: inherit; box-sizing: border-box;
}
.login-box .form-group input:focus { border-color: #1677ff; }
.login-box .remember { display:flex; align-items:center; gap:6px; font-size:13px; color:#555; margin: 4px 2px 14px; cursor:pointer; }
.login-err { color:#ff4d4f; font-size:13px; min-height:18px; margin-bottom:8px; text-align:center; }
.login-switch { text-align:center; font-size:13px; color:#888; margin-top:14px; }
.login-switch a { color:#1677ff; text-decoration:none; cursor:pointer; }
.login-switch a:hover { text-decoration: underline; }
.btn-top {
  padding: 6px 13px; border: 1.5px solid #d9d9d9; background:#fff; color:#555;
  border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .2s;
}
.btn-top:hover { border-color:#1677ff; color:#1677ff; }
.pw-tip { font-size: 12px; color: #999; text-align: left; margin-bottom: 12px; line-height: 1.5; }
</style>
</head>
<body>

<div class="container">

  <!-- 左侧录入 -->
  <div class="left-panel">
    <h2>📝 录入退货记录</h2>

    <div class="form-group">
      <label>店铺</label>
      <select id="shopSelect">
        <option value="哈德逊">哈德逊</option>
        <option value="辰润">辰润</option>
        <option value="多恩">多恩</option>
        <option value="伯克纳">伯克纳</option>
        <option value="阿达姆">阿达姆</option>
      </select>
    </div>

    <div class="form-group">
      <label>SKU（点击选择，可新增）</label>
      <div class="sku-selector" id="skuSelector"></div>
      <!-- 新增SKU输入行 -->
      <div class="sku-add-row" id="skuAddRow">
        <input type="text" id="skuAddInput" placeholder="输入新 SKU 名称" maxlength="40" />
        <button class="btn-ok" onclick="confirmAddSku()">确认</button>
        <button class="btn-cancel-s" onclick="cancelAddSku()">取消</button>
      </div>
    </div>

    <div class="form-group">
      <label>订单号</label>
      <input type="text" id="orderIdInput" placeholder="自动去除首尾空格" />
    </div>

    <div class="form-group">
      <label>日期（单个日期：6.1 / 6-1 / 6/1 / 2026.6.1）</label>
      <input type="text" id="dateInput" placeholder="如 6.1 、 6/1 、 2026.6.1" />
    </div>

    <div class="form-group">
      <label>退货原因</label>
      <input type="text" id="reasonInput" placeholder="输入退货原因" />
    </div>

    <button class="btn-add" onclick="addRecord()">➕ 添加记录</button>
  </div>

  <!-- 右侧列表 -->
  <div class="right-panel">

    <!-- 固定顶部：标题 + 统计 + 店铺标签 + 搜索 -->
    <div class="right-top-fixed">
      <div class="right-header">
        <h2>📊 退货记录列表</h2>
        <div class="stats">
          <span class="stat-badge">店铺: <b id="statShop">-</b></span>
          <span class="stat-badge">记录: <b id="statCount">0</b></span>
          <button class="btn-batch-del" id="batchDelBtn" onclick="batchDelete()">🗑️ 批量删除</button>
          <button class="btn-top" id="changePwBtn" onclick="showChangePw()">🔑 改密</button>
          <button class="btn-top" id="logoutBtn" onclick="doLogout()">退出</button>
        </div>
      </div>
      <div class="shop-tabs" id="shopTabs"></div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 搜索订单号…" oninput="renderList()" />
      </div>
    </div>

    <!-- 可滚动主体 -->
    <div class="right-scroll-body" id="listContainer"></div>
  </div>
</div>

<!-- 删除确认弹框 -->
<div class="modal-mask" id="delModal">
  <div class="modal-box">
    <h3>⚠️ 确认删除</h3>
    <p id="delMsg">确定要删除这条记录吗？</p>
    <div class="modal-actions">
      <button class="btn-confirm" onclick="confirmDelete()">确定删除</button>
      <button class="btn-cancel-m" onclick="closeDelModal()">取消</button>
    </div>
  </div>
</div>

<!-- 通用消息弹框（报错/提示） -->
<div class="modal-mask" id="msgModal">
  <div class="modal-box">
    <h3 id="msgTitle">提示</h3>
    <p id="msgText"></p>
    <div class="modal-actions">
      <button class="btn-confirm" style="background:#1677ff" onclick="closeMsg()">知道了</button>
    </div>
  </div>
</div>

<!-- 登录浮层 -->
<div class="modal-mask login-mask" id="loginMask">
  <div class="login-box">
    <!-- 登录 / 注册 -->
    <div id="authView">
      <h2 id="loginTitle">🔐 邀评系统登录</h2>
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="loginUser" placeholder="用户名" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitAuth()" />
      </div>
      <label class="remember"><input type="checkbox" id="loginRemember" checked /> 记住我（自动登录）</label>
      <div class="login-err" id="loginErr"></div>
      <button class="btn-add" id="loginSubmit" onclick="submitAuth()">登录</button>
      <div class="login-switch">
        <span id="loginSwitchText">还没有账号？</span>
        <a id="loginSwitchLink" onclick="toggleAuthMode()">注册新账号</a>
        <span style="margin:0 6px">|</span>
        <a onclick="showPwView()">修改密码</a>
      </div>
    </div>
    <!-- 登录页修改密码（未登录：账号 + 旧密码验证） -->
    <div id="pwView" style="display:none">
      <h2>🔑 修改密码</h2>
      <p class="pw-tip">忘记旧密码请联系管理员</p>
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="pwUser" placeholder="用户名" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>旧密码</label>
        <input type="password" id="pwOld" placeholder="输入当前密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitPwView()" />
      </div>
      <div class="form-group">
        <label>新密码（至少4位）</label>
        <input type="password" id="pwNew" placeholder="输入新密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitPwView()" />
      </div>
      <div class="login-err" id="pwViewErr"></div>
      <button class="btn-add" onclick="submitPwView()">确认修改</button>
      <div class="login-switch"><a onclick="backToAuth()">← 返回登录</a></div>
    </div>
  </div>
</div>

<!-- 修改密码弹框（登录后） -->
<div class="modal-mask" id="pwModal">
  <div class="modal-box">
    <h3>🔑 修改密码</h3>
    <p class="pw-tip">忘记旧密码请联系管理员</p>
    <div class="form-group" style="text-align:left;margin-bottom:12px">
      <label>旧密码</label>
      <input type="password" id="oldPwInput" placeholder="输入当前密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitChangePw()" />
    </div>
    <div class="form-group" style="text-align:left;margin-bottom:12px">
      <label>新密码（至少4位）</label>
      <input type="password" id="newPwInput" placeholder="输入新密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitChangePw()" />
    </div>
    <div class="login-err" id="pwErr"></div>
    <div class="modal-actions">
      <button class="btn-confirm" style="background:#1677ff" onclick="submitChangePw()">确定</button>
      <button class="btn-cancel-m" onclick="closePw()">取消</button>
    </div>
  </div>
</div>

<script>
// ========== 日期解析（只允许单个时间点：6.1 / 6-1 / 6/1 / 2026.6.1 / 2026-6-1） ==========
function p2(s) { return String(s).length < 2 ? '0' + s : String(s); }

// 构造 ISO 日期并校验合法性（2.30、13.5 等非法日期返回 null）
function buildIso(y, mo, d) {
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${p2(mo)}-${p2(d)}`;
}

// 无年份日期推断年份：取“最近一次已发生（不晚于今天）”的年份，与库内数据无关
// 例：今天 2027-01-05 输入 1.5 → 2027；今天 2026-09-02 输入 12.25 → 2025
function inferYear(mo, d) {
  const now = new Date();
  const cur = now.getFullYear();
  const today = new Date(cur, now.getMonth(), now.getDate()).getTime();
  if (new Date(cur, mo - 1, d).getTime() <= today) return cur;
  return cur - 1;
}

// 只接受单个日期。含 ~ ～ 或“日期-日期”的范围输入一律返回 null（不再支持时间段写法）
function parseDateStr(text) {
  if (!text) return null;
  const s = String(text).replace(/\s+/g, ''); // 去除全部空白（含内部空格）
  if (!s) return null;
  if (/[~～]/.test(s)) return null;              // 范围符号直接拒绝
  let m = s.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})$/); // 完整日期 2026.5.30 / 2026-5-30 / 2026/5/30
  if (m) return buildIso(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[.\-/](\d{1,2})$/);                    // 短日期 5.30 / 5-30 / 5/30
  if (m) return buildIso(inferYear(+m[1], +m[2]), +m[1], +m[2]);
  return null; // 含多个分隔符（如 6.1-6.5、2026.5.30-2026.6.2）或其他非法格式
}

function isoToShort(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  return parseInt(p[1], 10) + '.' + parseInt(p[2], 10);
}

// 记录日期显示：规范化单点日期（2026.5.30 → 5.30）；历史范围数据无法解析时原样显示
function recordDateDisplay(r) {
  const raw = r.dateRaw || '';
  if (raw) {
    const i = parseDateStr(raw);
    if (i) return isoToShort(i);
    return raw;
  }
  return r.dateDisplay || r.date || '';
}

// ========== 状态 ==========
let data = { records: {}, skuList: {} };
let currentShop = localStorage.getItem('yaoapp_lastShop') || '哈德逊';
let currentSKU = '';
let editingId  = null;
let delTarget  = null;

// ========== 初始化（先鉴权，自动登录） ==========
(async function init() {
  await bootAuth();
})();

async function bootAuth() {
  const token = getStoredToken();
  if (token) {
    try {
      const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.ok) { await enterApp(); return; }
    } catch (e) {}
  }
  const savedUser = localStorage.getItem('yaoapp_user');
  if (savedUser) document.getElementById('loginUser').value = savedUser;
  document.getElementById('loginRemember').checked = !!localStorage.getItem('yaoapp_token');
  showLogin();
}

async function enterApp() {
  showApp();
  await loadData();
  document.getElementById('shopSelect').value = currentShop;
  await tick();
  renderList();
}

async function loadData() {
  const res = await apiFetch('/api/data');
  data = await res.json();
  ['哈德逊','辰润','多恩','伯克纳','阿达姆'].forEach(s => {
    if (!data.records[s]) data.records[s] = [];
  });
  // 兼容旧数据：确保 skuList 字段存在
  if (!data.skuList) data.skuList = {};
  ['哈德逊','辰润','多恩','伯克纳','阿达姆'].forEach(s => {
    if (!data.skuList[s]) data.skuList[s] = [];
  });
}

// ========== 店铺切换 ==========
document.getElementById('shopSelect').addEventListener('change', async function() {
  currentShop = this.value;
  localStorage.setItem('yaoapp_lastShop', currentShop);
  currentSKU = '';
  cancelAddSku();
  await tick();
  renderList();
});

function onShopTabClick(shop) {
  currentShop = shop;
  localStorage.setItem('yaoapp_lastShop', currentShop);
  document.getElementById('shopSelect').value = shop;
  currentSKU = '';
  cancelAddSku();
  tick();
  renderList();
}

// ========== SKU 按钮 ==========
async function tick() {
  buildShopTabs();
  buildSkuButtons();
}

function buildShopTabs() {
  const wrap = document.getElementById('shopTabs');
  wrap.innerHTML = ['哈德逊','辰润','多恩','伯克纳','阿达姆'].map(s =>
    `<div class="shop-tab${s===currentShop?' active':''}" onclick="onShopTabClick('${s}')">${s}</div>`
  ).join('');
}

function getAllSkusForShop(shop) {
  // 从记录里提取已有SKU
  const records = data.records[shop] || [];
  const fromRecords = {};
  records.forEach(r => { const sku = r.sku || shop; fromRecords[sku] = true; });
  // 合并手动添加的SKU列表（可能有0条记录的新SKU）
  const fromList = (data.skuList[shop] || []);
  const merged = { ...fromRecords };
  fromList.forEach(s => { merged[s] = true; });
  return Object.keys(merged);
}

function buildSkuButtons() {
  const records = data.records[currentShop] || [];
  const countMap = {};
  records.forEach(r => {
    const sku = r.sku || currentShop;
    countMap[sku] = (countMap[sku] || 0) + 1;
  });

  const skus = getAllSkusForShop(currentShop);

  // 如果当前选中的SKU不在列表里，自动选第一个
  if (!skus.includes(currentSKU) || !currentSKU) currentSKU = skus[0] || '';

  const wrap = document.getElementById('skuSelector');
  let html = '';
  if (skus.length === 0) {
    html = '<span style="color:#bbb;font-size:13px">暂无SKU</span>';
  } else {
    html = skus.map(s => {
      const cnt = countMap[s] || 0;
      const cntStr = cnt > 0 ? `<small style="opacity:.6;margin-left:3px">(${cnt})</small>` : '';
      return `<span class="sku-btn${s===currentSKU?' active':''}" onclick="pickSKU('${esc(s)}')">${esc(s)}${cntStr}</span>`;
    }).join('');
  }
  // 追加"+ 新增 SKU"按钮
  html += `<span class="sku-add-btn" onclick="showAddSkuRow()">＋ 新增</span>`;
  wrap.innerHTML = html;
}

function pickSKU(sku) {
  currentSKU = sku;
  buildSkuButtons();
  const el = document.getElementById('sku-' + sku);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ========== 新增 SKU ==========
function showAddSkuRow() {
  const row = document.getElementById('skuAddRow');
  row.classList.add('show');
  const inp = document.getElementById('skuAddInput');
  inp.value = '';
  inp.focus();
}

function cancelAddSku() {
  document.getElementById('skuAddRow').classList.remove('show');
  document.getElementById('skuAddInput').value = '';
}

async function confirmAddSku() {
  const val = document.getElementById('skuAddInput').value.trim();
  if (!val) { alert('请输入 SKU 名称'); return; }

  const existing = getAllSkusForShop(currentShop);
  if (existing.includes(val)) {
    alert(`"${val}" 已存在，直接点选即可`);
    cancelAddSku();
    currentSKU = val;
    buildSkuButtons();
    return;
  }

  // 加入 skuList 持久化
  if (!data.skuList[currentShop]) data.skuList[currentShop] = [];
  data.skuList[currentShop].push(val);
  await saveData();

  currentSKU = val;
  cancelAddSku();
  buildSkuButtons();
}

// 按 Enter 确认新增 SKU
document.getElementById('skuAddInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') confirmAddSku();
  if (e.key === 'Escape') cancelAddSku();
});

// ========== 添加记录 ==========
async function addRecord() {
  const orderId = document.getElementById('orderIdInput').value.trim();
  const dateStr  = document.getElementById('dateInput').value.trim();
  const reason  = document.getElementById('reasonInput').value.trim();
  if (!currentSKU)  { showMsg('提示', '请先选择或新增一个SKU'); return; }
  if (!orderId)     { showMsg('提示', '请输入订单号'); return; }
  if (!dateStr)      { showMsg('提示', '请输入日期'); return; }
  if (!reason)       { showMsg('提示', '请输入退货原因'); return; }

  // 订单号唯一性校验（亚马逊订单号全局唯一，去全部空格后比对）
  const dup = findOrderId(orderId);
  if (dup) {
    showMsg('⚠️ 订单号重复', `订单号 ${orderId} 已存在（${dup.shop} 店铺 · ${recordDateDisplay(dup.rec)}），无法重复录入`);
    return;
  }

  const iso = parseDateStr(dateStr);
  if (!iso) {
    showMsg('⚠️ 日期格式有误', `无法识别日期「${dateStr}」，只支持单个日期，请使用如 6.1、6-1、6/1、2026.6.1（时间段写法已停用）`);
    return;
  }

  const rec = {
    id: Date.now() + Math.random(),
    orderId,
    dateRaw: dateStr,
    dateISO: iso,
    dateDisplay: isoToShort(iso),
    reason,
    shop: currentShop,
    sku: currentSKU
  };
  data.records[currentShop].push(rec);
  await saveData();
  document.getElementById('orderIdInput').value = '';
  document.getElementById('dateInput').value = '';
  document.getElementById('reasonInput').value = '';
  await tick();
  renderList();
}

// 全局查找订单号（去全部空格后比对），返回 {shop, rec} 或 null
function findOrderId(orderId) {
  const key = String(orderId || '').replace(/\s+/g, '');
  if (!key) return null;
  for (const shop of Object.keys(data.records)) {
    for (const r of data.records[shop]) {
      if (String(r.orderId || '').replace(/\s+/g, '') === key) return { shop, rec: r };
    }
  }
  return null;
}

// ========== 渲染列表 ==========
function renderList() {
  const container = document.getElementById('listContainer');
  let records = data.records[currentShop] || [];
  document.getElementById('statShop').textContent  = currentShop;
  document.getElementById('statCount').textContent = records.length;

  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  if (kw) records = records.filter(r => r.orderId.toLowerCase().includes(kw));

  if (records.length === 0) {
    container.innerHTML = '<div class="no-data">暂无数据</div>';
    return;
  }

  // 按 SKU 分组，组内按 dateISO 排序
  const groups = {};
  records.forEach(r => {
    const sku = r.sku || currentShop;
    if (!groups[sku]) groups[sku] = [];
    groups[sku].push(r);
  });
  Object.keys(groups).forEach(sku => {
    groups[sku].sort((a, b) => (a.dateISO||'').localeCompare(b.dateISO||''));
  });

  // 统一列宽 colgroup
  const colHTML = `<colgroup>
    <col class="col-cb" />
    <col class="col-oid" />
    <col class="col-date" />
    <col class="col-reason" />
    <col class="col-action" />
  </colgroup>`;

  let html = '';
  Object.keys(groups).forEach(sku => {
    html += `<div class="sku-section" id="sku-${sku}">
      <div class="sku-section-header">
        <span>📦 ${esc(sku)}</span>
        <span style="font-weight:400;font-size:12px;color:#999">${groups[sku].length} 条</span>
      </div>
      <table>
        ${colHTML}
        <thead><tr>
          <th class="checkbox-cell"><input type="checkbox" onchange="toggleAll(this)"></th>
          <th>订单号</th>
          <th>日期</th>
          <th>原因</th>
          <th class="action-cell">操作</th>
        </tr></thead>
        <tbody>`;
    groups[sku].forEach(r => {
      if (editingId === r.id) {
        html += `<tr style="background:#fffbe6">
          <td class="checkbox-cell"></td>
          <td><input class="edit-input" id="e_oid_${r.id}" value="${esc(r.orderId)}"></td>
          <td><input class="edit-input" id="e_date_${r.id}" value="${esc(r.dateRaw||r.dateDisplay||r.date)}"></td>
          <td><input class="edit-input" id="e_reason_${r.id}" value="${esc(r.reason)}"></td>
          <td class="action-cell">
            <button class="btn-sm btn-save" onclick="saveEdit(${r.id})">💾 保存</button>
            <button class="btn-sm btn-cancel" onclick="cancelEdit()">取消</button>
          </td>
        </tr>`;
      } else {
        const displayDate = recordDateDisplay(r);
        html += `<tr>
          <td class="checkbox-cell"><input type="checkbox" class="cb" data-id="${r.id}" data-shop="${esc(r.shop)}"></td>
          <td title="${esc(r.orderId)}">${esc(r.orderId)}</td>
          <td>${esc(displayDate)}</td>
          <td title="${esc(r.reason)}">${esc(r.reason)}</td>
          <td class="action-cell">
            <button class="btn-sm btn-edit" onclick="startEdit(${r.id})">✏️</button>
            <button class="btn-sm btn-del" onclick="showDelModal(${r.id},'${esc(r.shop)}')">🗑️</button>
          </td>
        </tr>`;
      }
    });
    html += '</tbody></table></div>';
  });

  container.innerHTML = html;
  updateBatchBtn();
}

// ========== 编辑 ==========
function startEdit(id) {
  editingId = id;
  renderList();
  setTimeout(() => { const el = document.getElementById('e_oid_'+id); if(el) el.focus(); }, 60);
}
function cancelEdit() { editingId = null; renderList(); }

async function saveEdit(id) {
  const oid    = document.getElementById('e_oid_'+id).value.trim();
  const dateT  = document.getElementById('e_date_'+id).value.trim();
  const reason = document.getElementById('e_reason_'+id).value.trim();
  if (!oid || !dateT || !reason) { showMsg('提示', '请填写完整'); return; }

  // 找到原记录
  let orig = null, origShop = null, origIdx = -1;
  for (const s of Object.keys(data.records)) {
    const idx = data.records[s].findIndex(r => r.id === id);
    if (idx !== -1) { orig = data.records[s][idx]; origShop = s; origIdx = idx; break; }
  }
  if (!orig) { showMsg('提示', '未找到该记录，可能已被删除'); return; }

  // 订单号变更时才做唯一性校验（排除自身）
  if (String(orig.orderId || '').replace(/\s+/g, '') !== String(oid).replace(/\s+/g, '')) {
    const dup = findOrderId(oid);
    if (dup) {
      showMsg('⚠️ 订单号重复', `订单号 ${oid} 已被 ${dup.shop} 店铺的 ${recordDateDisplay(dup.rec)} 记录占用`);
      return;
    }
  }

  const iso = parseDateStr(dateT);
  if (!iso) { showMsg('⚠️ 日期格式有误', `无法识别日期「${dateT}」，只支持单个日期，请使用如 6.1、6-1、6/1、2026.6.1（时间段写法已停用）`); return; }

  data.records[origShop][origIdx].orderId     = oid;
  data.records[origShop][origIdx].dateRaw     = dateT;
  data.records[origShop][origIdx].dateISO     = iso;
  data.records[origShop][origIdx].dateDisplay = isoToShort(iso);
  data.records[origShop][origIdx].reason      = reason;
  await saveData();
  editingId = null;
  await tick();
  renderList();
}

// ========== 删除 ==========
function showDelModal(id, shop) {
  delTarget = {id, shop};
  document.getElementById('delMsg').textContent = '确定要删除这条记录吗？';
  document.getElementById('delModal').classList.add('show');
}
function closeDelModal() {
  document.getElementById('delModal').classList.remove('show');
  delTarget = null;
}

// ========== 通用消息弹框 ==========
function showMsg(title, text) {
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgText').textContent = text;
  document.getElementById('msgModal').classList.add('show');
}
function closeMsg() {
  document.getElementById('msgModal').classList.remove('show');
}
async function confirmDelete() {
  if (!delTarget) return;
  const {id} = delTarget;
  // 全局按 id 定位删除（不依赖 shop 字段，避免脏数据导致删不掉）
  let removed = 0;
  for (const s of Object.keys(data.records)) {
    const before = data.records[s].length;
    data.records[s] = data.records[s].filter(r => r.id !== id);
    removed += before - data.records[s].length;
  }
  if (removed === 0) { alert('未找到该记录，可能已被删除'); closeDelModal(); return; }
  await saveData();
  await tick();
  renderList();
  closeDelModal();
}

// ========== 批量 ==========
function toggleAll(cb) {
  document.querySelectorAll('.cb').forEach(c => c.checked = cb.checked);
  updateBatchBtn();
}
function updateBatchBtn() {
  const n = document.querySelectorAll('.cb:checked').length;
  const btn = document.getElementById('batchDelBtn');
  if (n > 0) { btn.classList.add('show'); btn.textContent = `🗑️ 批量删除 (${n})`; }
  else btn.classList.remove('show');
}
async function batchDelete() {
  const cbs = document.querySelectorAll('.cb:checked');
  if (!cbs.length) return;
  if (!confirm(`确定删除选中的 ${cbs.length} 条记录？`)) return;
  const ids = new Set([...cbs].map(cb => parseFloat(cb.dataset.id)));
  // 全局按 id 定位删除（不依赖 shop 字段）
  for (const s of Object.keys(data.records)) {
    data.records[s] = data.records[s].filter(r => !ids.has(r.id));
  }
  await saveData();
  await tick();
  renderList();
}

// ========== 保存 ==========
async function saveData() {
  await apiFetch('/api/data', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
}

// ========== 工具 ==========
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== 登录 / 鉴权 ==========
let authMode = 'login'; // login | register

function getStoredToken() {
  return localStorage.getItem('yaoapp_token') || sessionStorage.getItem('yaoapp_token');
}
function storeToken(token, remember, username) {
  if (remember) {
    localStorage.setItem('yaoapp_token', token);
    if (username) localStorage.setItem('yaoapp_user', username);
  } else {
    sessionStorage.setItem('yaoapp_token', token);
  }
}
function showLogin() {
  document.getElementById('authView').style.display = 'block';
  document.getElementById('pwView').style.display = 'none';
  document.getElementById('loginMask').classList.add('show');
}
function showApp() {
  document.getElementById('loginMask').classList.remove('show');
  document.getElementById('loginErr').textContent = '';
}
function setLoginErr(msg) { document.getElementById('loginErr').textContent = msg || ''; }

// 带 token 的请求封装；401 自动跳登录
async function apiFetch(url, options = {}) {
  const token = getStoredToken();
  options.headers = Object.assign({}, options.headers, token ? { 'Authorization': 'Bearer ' + token } : {});
  const res = await fetch(url, options);
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  return res;
}

function toggleAuthMode() {
  authMode = (authMode === 'login') ? 'register' : 'login';
  const reg = authMode === 'register';
  document.getElementById('loginTitle').textContent = reg ? '📝 注册新账号' : '🔐 邀评系统登录';
  document.getElementById('loginSubmit').textContent = reg ? '注册' : '登录';
  document.getElementById('loginSwitchText').textContent = reg ? '已有账号？' : '还没有账号？';
  document.getElementById('loginSwitchLink').textContent = reg ? '去登录' : '注册新账号';
  setLoginErr('');
}

async function submitAuth() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const remember = document.getElementById('loginRemember').checked;
  if (!username || !password) { setLoginErr('请输入账号和密码'); return; }

  const url = authMode === 'register' ? '/api/register' : '/api/login';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    setLoginErr(j.error || '操作失败');
    return;
  }
  const j = await res.json();
  storeToken(j.token, remember, username);
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  await enterApp();
}

function doLogout() {
  const token = getStoredToken();
  if (token) fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(() => {});
  localStorage.removeItem('yaoapp_token');
  localStorage.removeItem('yaoapp_user');
  sessionStorage.removeItem('yaoapp_token');
  document.getElementById('loginUser').value = localStorage.getItem('yaoapp_user') || '';
  showLogin();
}

// 修改密码（登录后：必须验证旧密码）
function showChangePw() {
  document.getElementById('oldPwInput').value = '';
  document.getElementById('newPwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwModal').classList.add('show');
}
function closePw() { document.getElementById('pwModal').classList.remove('show'); }
async function submitChangePw() {
  const oldPassword = document.getElementById('oldPwInput').value;
  const pw = document.getElementById('newPwInput').value;
  if (!oldPassword) { document.getElementById('pwErr').textContent = '请输入旧密码'; return; }
  if (pw.length < 4) { document.getElementById('pwErr').textContent = '新密码至少4位'; return; }
  const res = await apiFetch('/api/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oldPassword, password: pw })
  });
  if (res.ok) { showMsg('✅ 修改成功', '密码已修改，请牢记新密码'); closePw(); }
  else { const j = await res.json().catch(() => ({})); document.getElementById('pwErr').textContent = j.error || '失败'; }
}

// 登录页修改密码（未登录：账号 + 旧密码验证，不做手机验证码）
function showPwView() {
  document.getElementById('pwUser').value = document.getElementById('loginUser').value || '';
  document.getElementById('pwOld').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwViewErr').textContent = '';
  document.getElementById('authView').style.display = 'none';
  document.getElementById('pwView').style.display = 'block';
}
function backToAuth() {
  document.getElementById('authView').style.display = 'block';
  document.getElementById('pwView').style.display = 'none';
  setLoginErr('');
}
async function submitPwView() {
  const username   = document.getElementById('pwUser').value.trim();
  const oldPassword = document.getElementById('pwOld').value;
  const password   = document.getElementById('pwNew').value;
  const errEl = document.getElementById('pwViewErr');
  if (!username || !oldPassword || !password) { errEl.textContent = '请填写完整'; return; }
  if (password.length < 4) { errEl.textContent = '新密码至少4位'; return; }
  const res = await fetch('/api/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, oldPassword, password })
  });
  if (res.ok) {
    showMsg('✅ 修改成功', '密码已修改，请用新密码登录');
    document.getElementById('pwUser').value = '';
    document.getElementById('pwOld').value = '';
    document.getElementById('pwNew').value = '';
    backToAuth();
  } else {
    const j = await res.json().catch(() => ({}));
    errEl.textContent = j.error || '操作失败';
  }
}

document.addEventListener('change', e => { if(e.target.classList.contains('cb')) updateBatchBtn(); });
